<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Changes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <h1>Testing Text Input Changes</h1>

        <form id="test-form">
            <div class="form-group">
                <label for="test-observation">Observation (Text Input)</label>
                <input type="text" id="test-observation" placeholder="Test observation...">
            </div>

            <div class="form-group">
                <label for="test-feeling">Feeling (Text Input)</label>
                <input type="text" id="test-feeling" placeholder="Test feeling...">
            </div>

            <button type="button" id="test-btn" class="btn btn-primary">Test Functionality</button>
        </form>

        <div id="test-results" style="margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
            <h3>Test Results:</h3>
            <p id="test-output">Click the button to test...</p>
        </div>
    </div>

    <script>
        document.getElementById('test-btn').addEventListener('click', function () {
            const observation = document.getElementById('test-observation');
            const feeling = document.getElementById('test-feeling');

            // Test that we can access .value property
            const obsValue = observation.value;
            const feelingValue = feeling.value;

            // Test that we can call .focus() method
            observation.focus();

            // Test that we can modify .value
            observation.value = 'Test passed - observation';
            feeling.value = 'Test passed - feeling';

            document.getElementById('test-output').innerHTML = `
                <strong>✅ All tests passed!</strong><br>
                - .value property works: "${obsValue}"<br>
                - .focus() method works<br>
                - .value assignment works<br>
                - CSS styling applied correctly
            `;
        });
    </script>
</body>
</html>
